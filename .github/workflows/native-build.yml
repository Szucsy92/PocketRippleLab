name: Natív Android build – aláírt APK

# Natív Android build. Az első futás egyszer létrehozza az aláírókulcsot,
# titkosítva a külön signing ágra menti; minden további futás ugyanazt használja.
# Indítás: Actions → Natív Android build – aláírt APK → Run workflow.
# Opcionálisan megadható ANDROID_KEYSTORE_PASSWORD repository secret.
# Ha nincs ilyen secret, a workflow véletlen jelszót készít és a signing ágon tárolja.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "src/assets/models/**"
      - ".github/workflows/native-build.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: native-build
  cancel-in-progress: false

jobs:
  keystore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      ready: ${{ steps.make.outputs.ready }}
    env:
      KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_BASE64_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Aláírókulcs létrehozása vagy visszaállítása
        id: make
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/pocketripplelab.keystore"
          ENC="$RUNNER_TEMP/pocketripplelab.keystore.enc"
          HAS_BRANCH=0
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" signing >/dev/null 2>&1; then
            HAS_BRANCH=1
            git fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" signing
          fi

          if [ "$HAS_BRANCH" = 1 ]; then
            git show FETCH_HEAD:release.keystore.enc > "$ENC"
            if [ -n "${KS_PASS_SECRET:-}" ]; then
              KS_PASS="$KS_PASS_SECRET"
            else
              KS_PASS="$(git show FETCH_HEAD:keystore.pass)"
            fi
            echo "::add-mask::$KS_PASS"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS -in "$ENC" -out "$KS" \
              || { echo "::error::A signing ágon tárolt kulcs nem fejthető vissza."; exit 1; }
            echo "Meglévő aláírókulcs visszaállítva a signing ágról."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            if [ -n "${KS_BASE64_SECRET:-}" ]; then
              if [ -z "${KS_PASS_SECRET:-}" ] || [ -z "${KS_ALIAS_SECRET:-}" ]; then
                echo "::error::A régi kulcs használatához mindhárom ANDROID_KEYSTORE_* secret szükséges."
                exit 1
              fi
              printf '%s' "$KS_BASE64_SECRET" | base64 -d > "$KS"
              KS_PASS="$KS_PASS_SECRET"
              ALIAS="$KS_ALIAS_SECRET"
              echo "Meglévő, korábban Secrets-ben tárolt aláírókulcs átvétele a signing ágra."
            else
              if [ -n "${KS_PASS_SECRET:-}" ]; then
                KS_PASS="$KS_PASS_SECRET"
              else
                KS_PASS="$(openssl rand -hex 24)"
              fi
              ALIAS=pocketripplelab
            fi
            if [ "${#KS_PASS}" -lt 12 ]; then
              echo "::error::Az ANDROID_KEYSTORE_PASSWORD legalább 12 karakter legyen."
              exit 1
            fi
            echo "::add-mask::$KS_PASS"
            if [ ! -s "$KS" ]; then
              keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias "$ALIAS" \
                -storepass "$KS_PASS" -keypass "$KS_PASS" -keyalg RSA -keysize 4096 -validity 36525 \
                -dname "CN=PocketRippleLab"
            fi
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KS_PASS -in "$KS" -out "$ENC"

            TMP="$(mktemp -d)"
            cp "$ENC" "$TMP/release.keystore.enc"
            printf '%s' "$KS_PASS" > "$TMP/keystore.pass"
            printf '%s' "$ALIAS" > "$TMP/key.alias"
            cd "$TMP"
            git init -q -b signing
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add release.keystore.enc keystore.pass key.alias
            git commit -q -m "Android signing key (encrypted, generated once)"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signing
            echo "Új aláírókulcs létrehozva és titkosítva elmentve a signing ágra."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Android aláírókulcs elkészült"
              echo
              echo "A kulcs titkosítva a signing ágon van. A következő workflow-futás automatikusan visszaállítja és ezzel írja alá az APK-t."
              echo "Indítsd újra az Actions → Natív Android build – aláírt APK → Run workflow folyamatot."
              echo
              echo "A kulcs jelszava a signing ágon van tárolva. Ha ANDROID_KEYSTORE_PASSWORD secretet használsz, annak egyeznie kell ezzel a jelszóval."
              echo
              echo "Fontos: a signing ágat és annak tartalmát ne töröld. Ez biztosítja, hogy az új APK-k ugyanazzal a kulccsal legyenek aláírva."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: A build újraindítása az új kulccsal
        if: steps.make.outputs.ready == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run native-build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      version: ${{ steps.s.outputs.version }}
      code: ${{ steps.s.outputs.code }}
    steps:
      - id: s
        run: |
          echo "stamp=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android:
    needs: [stamp, keystore]
    # Csak akkor épít, ha a signing ágon már rendelkezésre áll az aláírókulcs.
    if: ${{ needs.keystore.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Nincs gradlew a repóban, ezért a Gradle-t az action telepíti (AGP 8.9.2 ≥ Gradle 8.11.1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Aláírókulcs visszaállítása
        env:
          GH_TOKEN: ${{ github.token }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          git fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signing
          ENC="$RUNNER_TEMP/pocketripplelab.keystore.enc"
          KS_FILE="$RUNNER_TEMP/pocketripplelab.keystore"
          git show FETCH_HEAD:release.keystore.enc > "$ENC"
          if [ -n "${KS_PASS_SECRET:-}" ]; then
            KS_PASS="$KS_PASS_SECRET"
          else
            KS_PASS="$(git show FETCH_HEAD:keystore.pass)"
          fi
          echo "::add-mask::$KS_PASS"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS -in "$ENC" -out "$KS_FILE"
          chmod 600 "$KS_FILE"
          echo "ANDROID_KEYSTORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          ALIAS="$(git show FETCH_HEAD:key.alias 2>/dev/null || echo pocketripplelab)"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      # A logika (koppintás-kapu, hullámok, testfizika, kamera, halak) egységtesztjei; nem blokkolják a kiadást.
      - name: Egységtesztek
        continue-on-error: true
        run: gradle -p native/android testDebugUnitTest --no-daemon

      - name: Natív Android release APK
        run: |
          set -euo pipefail
          gradle -p native/android assembleRelease --no-daemon
          APK=$(find native/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" "out/PocketRippleLab-${BUILD_STAMP}.apk"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose "out/PocketRippleLab-${BUILD_STAMP}.apk"

      - name: Kulcs törlése a futtatóról
        if: always()
        run: rm -f "$RUNNER_TEMP/pocketripplelab.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: pocketripplelab-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    if: ${{ needs.android.result == 'success' }}
    needs: [stamp, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocketripplelab-apk
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ needs.stamp.outputs.stamp }}-${{ needs.stamp.outputs.code }}
          name: Víztükör ${{ needs.stamp.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            Natív Android build · ${{ needs.stamp.outputs.version }} (#${{ needs.stamp.outputs.code }})
            Aláírt Release APK. Az alkalmazás a Beállítások → Frissítés alatt innen tölti le az újabb verziót (azonos kulccsal aláírva, ezért felülírja a régit).
          files: out/*.apk
